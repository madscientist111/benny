# Free checks on every PR and every push to main: types, the deterministic tests (tests/), and
# whether the decision model's recorded eval still matches the code (no model calls).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Decision eval baseline is current
        run: pnpm probe:check
